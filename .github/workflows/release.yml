name: 'Release'

# Pushing a tag vMAJOR.MINOR.PATCH[-prerelease] (for example v1.0.0 or v1.1.0-rc.1) builds the packages, publishes them to
# nuget.org after a manual approval and creates a GitHub release. See .github/CONTRIBUTING.md ("Releasing").
# Running the workflow by hand only builds and uploads the packages (a dry run): nothing is published.
on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  build:
    name: build and pack
    # Windows: assemblies are fully strong-name signed with key.snk (other systems only public-sign)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Determine the version
      id: version
      shell: bash
      run: |
        props_version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n 1)"

        if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
          # dry run
          suffix="manual.${GITHUB_RUN_NUMBER}"
        else
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not a version tag (vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[3]}"

          if [[ "$tag_version" != "$props_version" ]]; then
            echo "::error::tag version $tag_version differs from VersionPrefix $props_version in Directory.Build.props"
            exit 1
          fi

          # releases are cut from master only
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::commit $GITHUB_SHA of tag $GITHUB_REF_NAME is not on master"
            exit 1
          }
        fi

        version="$props_version${suffix:+-$suffix}"
        if [[ -n "$suffix" ]]; then
          echo "VersionSuffix=$suffix" >> "$GITHUB_ENV"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Version: $version"

    - name: Extract the release notes
      if: github.event_name == 'push'
      shell: bash
      run: bash .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - run: dotnet --info

    # build + all tests + pack; NuGet audit fails the build on vulnerable packages
    - name: Build, test and pack
      run: ./build.ps1

    - name: Verify packages
      shell: pwsh
      run: ./.github/scripts/verify-packages.ps1 -Version "${{ steps.version.outputs.version }}"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: packages
        path: nuget/
        if-no-files-found: error

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: github.event_name == 'push'
      with:
        name: release-notes
        path: release-notes.md
        if-no-files-found: error

  publish:
    name: publish to nuget.org
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # configure required reviewers and the NUGET_API_KEY secret on this environment: nobody can publish without an approval
    environment: nuget
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: packages
        path: packages

    # the symbol packages (*.snupkg) next to a package are pushed with it
    - name: Push to nuget.org
      working-directory: packages
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  github-release:
    name: create the GitHub release
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: packages
        path: packages

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-notes
        path: notes

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.build.outputs.version }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
      run: |
        flags=()
        if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
        gh release create "$GITHUB_REF_NAME" packages/* \
          --repo "$GITHUB_REPOSITORY" \
          --verify-tag \
          --title "$VERSION" \
          --notes-file notes/release-notes.md \
          "${flags[@]}"
