name: 'CI'

on:
  push:
    branches:
    - master
    - feature/**
    tags:
    - '*.*.*'
  pull_request:

# the build only reads the repository
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macOS-latest, ubuntu-latest, windows-latest]
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - run: dotnet --info

    # builds, runs the tests and packs every library (NuGet audit fails the build on vulnerable packages)
    - if: runner.os != 'Windows'
      run: ./build.sh
    - if: runner.os == 'Windows'
      run: ./build.ps1
